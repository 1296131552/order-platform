name: 🔒 安全扫描 (Security Scan)

on:
  push:
    branches: [ main, develop, feature/** ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # 每周一上午 9 点（UTC）执行定期扫描
    - cron: '0 9 * * 1'
  workflow_dispatch:  # 允许手动触发

env:
  SEMGREP_VERSION: 1.147.0
  JAVA_VERSION: '21'

jobs:
  semgrep-scan:
    name: Semgrep 代码安全扫描
    runs-on: ubuntu-latest

    # 权限配置（可选，用于发布 PR 评论）
    permissions:
      contents: read
      security-events: write
      pull-requests: write

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取完整历史，便于 blame 分析

      - name: 🔧 设置 Java 环境
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'

      - name: 📦 安装依赖
        run: mvn dependency:go-offline -B

      - name: 🔍 运行 Semgrep 扫描
        id: semgrep
        uses: returntocorp/semgrep@v1
        with:
          config: auto  # 使用自动配置，包含所有推荐规则
          # 可选：指定自定义规则
          # config: |
          #   - https://semgrep.dev/p/java
          #   - .semgrep/rules

          # 仅扫描新修改的文件（PR 场景）
          # diff: aware

          # 生成 SARIF 格式报告（用于 GitHub Security）
          sarif: true

          # 严重程度阈值
          severity: WARNING  # 只报告 WARNING 及以上级别

          # 超时设置
          timeout: 300

        env:
          # 设置 GitHub Token（用于 PR 评论）
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📊 上传 SARIF 报告到 GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: 📝 上传扫描结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-results
          path: |
            semgrep.sarif
            semgrep.json

      - name: 💬 PR 评论（仅在 PR 时）
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const results = JSON.parse(fs.readFileSync('semgrep.json', 'utf8'));

            if (results.results.length === 0) {
              console.log('✅ 无安全问题发现');
              return;
            }

            const issues = results.results.map(r => {
              const file = r.path;
              const line = r.start.line;
              const msg = r.message;
              const severity = r.extra.severity;
              const cwe = r.extra.metadata.cwe ? r.extra.metadata.cwe.join(', ') : 'N/A';

              return `**${severity}** - ${file}:${line}\n- ${msg}\n- CWE: ${cwe}`;
            }).join('\n\n');

            const comment = `## 🔒 Semgrep 安全扫描结果\n\n发现 ${results.results.length} 个问题：\n\n${issues}\n\n请查看 [完整报告](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  dependency-check:
    name: 依赖漏洞扫描
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 🔧 设置 Java 环境
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'

      - name: 🔍 运行 OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'backend'
          path: '.'
          format: 'HTML'
          out: 'dependency-check-report'

      - name: 📊 上传依赖检查报告
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: dependency-check-report

      - name: 📈 上传到 GitHub Security（依赖扫描）
        uses: advanced-security/maven-dependency-submission-action@v1

  code-ql:
    name: CodeQL 代码分析
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'java' ]

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 🔧 初始化 CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      - name: 🔍 构建 Java 项目
        run: |
          mvn clean compile -B -DskipTests

      - name: 🔎 执行 CodeQL 分析
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  summary-report:
    name: 生成安全扫描总结报告
    runs-on: ubuntu-latest
    needs: [semgrep-scan, dependency-check, code-ql]
    if: always()

    steps:
      - name: 📥 下载所有报告
        uses: actions/download-artifact@v4
        with:
          path: reports

      - name: 📊 生成总结报告
        run: |
          echo "# 🔒 安全扫描总结报告" > summary.md
          echo "" >> summary.md
          echo "**扫描时间**: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> summary.md
          echo "**提交**: ${{ github.sha }}" >> summary.md
          echo "" >> summary.md
          echo "## 扫描结果" >> summary.md
          echo "- ✅ Semgrep: 已完成" >> summary.md
          echo "- ✅ 依赖检查: 已完成" >> summary.md
          echo "- ✅ CodeQL: 已完成" >> summary.md
          echo "" >> summary.md
          echo "请查看详细报告附件。" >> summary.md

      - name: 💬 发布总结评论
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('summary.md', 'utf8');

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });

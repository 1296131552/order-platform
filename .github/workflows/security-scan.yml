name: 🔒 安全扫描 (Security Scan)

on:
  push:
    branches: [ main, develop, feature/** ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # 每周一上午 9 点（UTC）执行定期扫描
    - cron: '0 9 * * 1'
  workflow_dispatch:  # 允许手动触发

env:
  JAVA_VERSION: '21'

jobs:
  semgrep-scan:
    name: Semgrep 代码安全扫描
    runs-on: ubuntu-latest

    # 使用官方 Semgrep Docker 镜像
    container:
      image: semgrep/semgrep

    # 权限配置（仅读取代码）
    permissions:
      contents: read

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取完整历史

      - name: 🔍 运行 Semgrep 扫描
        run: |
          # 使用社区版规则扫描，不生成 SARIF（需要 token）
          semgrep --config=auto --json --output=semgrep.json || true
        continue-on-error: true

      - name: 📝 上传扫描结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-results
          path: semgrep.json
          retention-days: 30

  dependency-check:
    name: 依赖漏洞扫描
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 🔧 设置 Java 环境
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'

      - name: 🔍 运行 OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'backend'
          path: '.'
          format: 'HTML'
          out: 'dependency-check-report'
        continue-on-error: true

      - name: 📊 上传依赖检查报告
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report
          path: dependency-check-report
          retention-days: 30

  summary-report:
    name: 生成安全扫描总结报告
    runs-on: ubuntu-latest
    needs: [semgrep-scan, dependency-check]
    if: always()

    steps:
      - name: 📥 下载所有报告
        uses: actions/download-artifact@v4
        with:
          path: reports
        continue-on-error: true

      - name: 📊 生成总结报告
        run: |
          echo "# 🔒 安全扫描总结报告" > summary.md
          echo "" >> summary.md
          echo "**扫描时间**: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> summary.md
          echo "**提交**: ${{ github.sha }}" >> summary.md
          echo "**分支**: ${{ github.ref_name }}" >> summary.md
          echo "" >> summary.md
          echo "## 扫描结果" >> summary.md
          echo "- ✅ Semgrep: 代码安全扫描已完成" >> summary.md
          echo "- ✅ 依赖检查: 依赖漏洞扫描已完成" >> summary.md
          echo "" >> summary.md
          echo "## 报告下载" >> summary.md
          echo "请查看本次运行的 Artifacts 获取详细报告。" >> summary.md
          echo "" >> summary.md
          echo "**注意**：这是社区版安全扫描，功能有限。如需完整功能，请配置 SEMGREP_APP_TOKEN。" >> summary.md

      - name: 📝 上传总结报告
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-summary
          path: summary.md
          retention-days: 90

      - name: 💬 发布总结评论
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('summary.md', 'utf8');

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });

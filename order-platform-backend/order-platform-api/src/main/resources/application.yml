server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: order-platform

  # 数据源配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/order_platform?serverTimezone=Asia/Shanghai&connectionCollation=utf8mb4_unicode_ci
    username: root
    password: w123456789
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false

  # Flyway 数据库迁移配置
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    encoding: UTF-8
    validate-on-migrate: true

  # Redis 配置
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: 3000ms

  # Jackson 配置
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
    serialization:
      write-dates-as-timestamps: false

  # 文件上传配置
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.company.order.visual.*.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# Knife4j API文档配置
knife4j:
  enable: true
  setting:
    language: zh_cn
    # 增强功能 
    enable-swagger-models: true   # 启用「实体类列表」模块（展示DTO/Entity字段说明）
    enable-dociment-manage: true  # 启用「文档管理」模块（支持导出Markdown/HTML/PDF）
    swagger-model-name: 实体类列表 # 显示名称
    # 调试功能
    enable-reload-cache-parameter: true
    # 分组显示
    enable-version: true
    # 生产环境
    production: false  # 8. 生产环境屏蔽开关（false=开发/测试环境不屏蔽，true=生产禁用文档）

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true 
    path: /swagger-ui.html
  #API 基本信息
  info:
    title: 订单可视化数字化管理平台 API
  # 服务器配置
  server:
    - url: http://localhost:8080/api
      description: 本地开发环境
    - url: http://test.example.com/api
      description: 测试环境  
  # 分组配置
  group-configs:
    - group: order
      display-name: 订单管理
      paths-to-match: /order/**
    - group: shipment
      display-name: 发运管理
      paths-to-match: /shipment/**
    - group: partner
      display-name: 合作方管理
      paths-to-match: /partner/**
    - group: dashboard
      display-name: 看板统计
      paths-to-match: /dashboard/**
    - group: attachment
      display-name: 附件管理
      paths-to-match: /attachment/**
    - group: exception
      display-name: 异常处理
      paths-to-match: /exception/**
    - group: visualization
      display-name: 可视化服务
      paths-to-match: /visualization/**
    - group: user
      display-name: 用户权限
      paths-to-match: /user/**
  # JWT 认证配置
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  # 全局参数（如请求头中的 token）
  default-flat-param-object: true
  
# 日志配置
logging:
  level:
    com.company.order.visual: debug
    com.baomidou.mybatisplus: debug
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
